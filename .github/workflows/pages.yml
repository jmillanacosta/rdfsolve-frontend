name: GitHub Pages - UI demo

on:
  push:
    branches: [flasking]
    paths:
      - src/**
      - demo/**
      - package.json
      - tsconfig.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript bundle
        run: npm run build

      - name: Assemble GitHub Pages output
        run: |
          mkdir -p _site
          cp demo/index.html _site/index.html
          cp -r demo/dist _site/dist
          # Include pre-baked schema JSONLDs for the demo
          for f in demo/*.jsonld; do [ -f "$f" ] && cp "$f" _site/ || true; done
          # Generate manifest.json listing every .jsonld file so the
          # demo can discover all datasets at runtime instead of
          # requiring a hardcoded list.
          node -e "
            const fs = require('fs');
            const path = require('path');
            const files = fs.readdirSync('demo').filter(f => f.endsWith('.jsonld'));
            const manifest = files.map(f => {
              const id = f.replace(/\.jsonld$/, '');
              const name = id
                .replace(/[._]/g, ' ')
                .replace(/\b\w/g, c => c.toUpperCase());
              return { id, file: f, name };
            });
            fs.writeFileSync('_site/manifest.json', JSON.stringify(manifest, null, 2));
            console.log('manifest.json: ' + manifest.length + ' entries');
          "

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
