name: GitHub Pages - UI demo

on:
  push:
    branches: [flasking]
    paths:
      - src/**
      - demo/**
      - package.json
      - tsconfig.json
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build TypeScript bundle
        run: npm run build

      - name: Assemble GitHub Pages output
        run: |
          mkdir -p _site
          cp demo/index.html _site/index.html
          cp -r demo/dist _site/dist
          # Include pre-baked schema JSONLDs for the demo
          for f in demo/*.jsonld; do [ -f "$f" ] && cp "$f" _site/ || true; done

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site/

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
